name: CI

permissions:
  contents: read

# 由 ae adopt 產生（分支名稱取自 .agent/config.toml）。檢查邏輯與工具版本在 agent-engineering 裡（ae ci …），升級工具就跟著更新；
# 這裡只放專案自己的部分：語言版本、安裝相依、make check、make coverage
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

env:
  AE: .claude/skills/agent-engineering/bin/ae

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0     # 覆蓋率檢查要跟整合分支比 diff
          submodules: true   # 工具本體（ae）
      - name: Set up Python  # 不要刪：ae 需要 3.11 以上，跟專案語言無關
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 專案初始化（project-init）合併前還沒有 Makefile，後續步驟全部跳過
      - name: Detect Makefile
        id: detect
        run: if [ -f Makefile ]; then echo "found=true" >> "$GITHUB_OUTPUT"; else echo "found=false" >> "$GITHUB_OUTPUT"; fi
      # 專案語言版本：技術棧待甲方決定（docs/architecture.md「待決定」），定案後由 stack-scaffold 單加上（選 Python 以外的語言時，例：actions/setup-go@v5）
      # CI 用 .env.example 的預設值；需要機密的測試改用 GitHub secrets
      - name: Prepare env
        if: steps.detect.outputs.found == 'true'
        run: if [ -f .env.example ]; then cp .env.example .env; fi
      - name: Install dependencies
        if: steps.detect.outputs.found == 'true'
        run: make ci-setup
      - name: Check
        if: steps.detect.outputs.found == 'true'
        run: make check
      # 改到的程式碼覆蓋率（門檻 80%）：只在開到整合分支的 PR 檢查；發版 PR 是已逐張檢查過的累積
      # make coverage 把 Cobertura／JaCoCo XML 寫到 coverage-reports/（寫法見 agent-engineering 的 backend-standards skill）
      # 需要 DB 時在這步之前加 docker compose up -d <服務>：測試在 runner 上跑，在容器裡跑報告路徑會對不回 repo
      # 相依與 Makefile 一致：Install dependencies 跑 make ci-setup，這裡跑 make coverage；第一階段資料存記憶體，不需要開 DB
      - name: Coverage of changed lines
        if: steps.detect.outputs.found == 'true' && github.event_name == 'pull_request' && github.base_ref == 'develop'
        env:
          # 只有用 JaCoCo（Java／Kotlin）才要填原始碼目錄；提案的選項都用 Cobertura，留空
          COVERAGE_SRC_ROOTS: ""
        run: |
          make coverage
          "$AE" ci coverage-gate

  # 資安稽核：每個 PR 都跑，ae pr merge 要求所有 check 綠
  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0     # 密鑰掃描要看整段歷史，刪掉的 secret 仍在 git 裡
          submodules: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan (gitleaks, osv-scanner, semgrep)
        run: '"$AE" ci security'
